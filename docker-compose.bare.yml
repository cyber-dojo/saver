# Layered on docker-compose.yml by bin/run_tests_bare.sh (via COMPOSE_FILE),
# so the server tests run in the bare image, the Dockerfile's base stage
# (built with --target base): Ruby, its gems, the OS packages and the saver
# user, with no source code. The source and tests are mounted, as they are
# for the deployed image, so the deployed image need not be built before the
# tests run.

services:

  server:
    image: ${CYBER_DOJO_SAVER_BARE_IMAGE}
    entrypoint: [ "sleep", "infinity" ]
    working_dir: /saver/source
    environment:
      - COMMIT_SHA=${COMMIT_SHA}

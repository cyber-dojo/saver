# Layered on docker-compose.yml by bin/run_tests_bare.sh (via COMPOSE_FILE),
# so the server tests run in the runtime, the Dockerfile's base stage (built
# with --target base): Ruby, its gems, the OS and the saver user, with no
# source. The source and tests are mounted, as they are for the image, so no
# image need be built with the source in it before the tests run.

services:

  server:
    image: ${CYBER_DOJO_SAVER_RUNTIME_IMAGE}
    entrypoint: [ "sleep", "infinity" ]
    working_dir: /saver/source
    environment:
      - COMMIT_SHA=${COMMIT_SHA}
